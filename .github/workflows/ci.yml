# CI: Python and Go SDK tests and the install-line check on every push to the default branch and
# every pull request. Actions are pinned to commits (comment: tag, date read).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: IAIso-v5.0/core/iaiso-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, read 2026-10-08
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, read 2026-10-08
        with:
          python-version: '3.12'
      - name: Install the package and the test runner
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q

  go:
    name: Go SDK (build, vet, gofmt, tests, 72 vectors)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: IAIso-v5.0/core/iaiso-go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, read 2026-10-08
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0, read 2026-10-11
        with:
          go-version-file: IAIso-v5.0/core/iaiso-go/go.mod
          cache: false
      - name: The library sources are in git
        run: test -f iaiso/core/engine.go
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
      - name: Tests
        run: go test ./...
      - name: Conformance vectors (the SDK's copy and the shared spec)
        run: |
          go run ./cmd/iaiso-conformance ./spec
          go run ./cmd/iaiso-conformance ../spec

  install-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, read 2026-10-08
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, read 2026-10-08
        with:
          python-version: '3.12'
      - name: No document names a package the maintainers do not hold
        run: python scripts/check_install_lines.py
